name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross
        if: matrix.os != 'windows-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            cargo build --release --target ${{ matrix.target }}
          else
            cross build --release --target ${{ matrix.target }}
          fi

      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir -p dist
          # Suche die Binärdatei (mit oder ohne .exe) rekursiv im target-Ordner
          # 'find' ist robuster als ein harter Pfad, da Cross-Compiler Pfade variieren können
          BIN_PATH=$(find target -name "ipmc" -o -name "ipmc.exe" | head -n 1)
          
          if [ -z "$BIN_PATH" ]; then
            echo "Fehler: Binärdatei wurde nicht gefunden!"
            exit 1
          fi
          
          echo "Kopiere $BIN_PATH nach dist/ipmc-${{ matrix.target }}"
          # Falls Windows, .exe anhängen
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cp "$BIN_PATH" "dist/ipmc-${{ matrix.target }}.exe"
          else
            cp "$BIN_PATH" "dist/ipmc-${{ matrix.target }}"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipmc-${{ matrix.target }}
          path: dist/

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish to GitHub
        uses: softprops/action-gh-release@v1
        with:
          files: release-assets/*
          generate_release_notes: true
