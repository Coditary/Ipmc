name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross (nur für Unix)
        if: matrix.os != 'windows-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      # --- Build-Sektion pro Betriebssystem ---
      - name: Build (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: cargo build --release --target ${{ matrix.target }}

      # --- Artifact-Vorbereitung pro Betriebssystem ---
      - name: Prepare Artifact (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist
          # Binärdatei liegt bei cross meist in target/<target>/release/ipmc
          cp target/${{ matrix.target }}/release/ipmc dist/ipmc-${{ matrix.target }}

      - name: Prepare Artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist
          # Unter Windows heißt sie ipmc.exe
          cp target/${{ matrix.target }}/release/ipmc.exe dist/ipmc-${{ matrix.target }}.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipmc-${{ matrix.target }}
          path: dist/

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish to GitHub
        uses: softprops/action-gh-release@v1
        with:
          files: release-assets/*
          generate_release_notes: true
