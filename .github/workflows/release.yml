name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Cross-Compilation Unterstützung für Linux aarch64
      - name: Install Cross
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        # Nutzt 'cross', falls vorhanden, sonst 'cargo'
        run: |
          if [ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Prepare Artifact
        shell: bash
        run: |
          # Benenne die Binärdatei einheitlich um
          mkdir -p dist
          BIN_EXT=""
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then BIN_EXT=".exe"; fi
          cp target/${{ matrix.target }}/release/ipmc${BIN_EXT} dist/ipmc-${{ matrix.target }}${BIN_EXT}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipmc-${{ matrix.target }}
          path: dist/

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish to GitHub
        uses: softprops/action-gh-release@v1
        with:
          files: release-assets/*
          generate_release_notes: true
