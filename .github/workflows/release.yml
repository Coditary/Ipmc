name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross
        if: matrix.os != 'windows-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        run: |
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            cargo build --release --target ${{ matrix.target }}
          else
            cross build --release --target ${{ matrix.target }}
          fi

      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir -p dist
          BIN_EXT=""
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then BIN_EXT=".exe"; fi
          
          # Wir nutzen 'find', um die Binärdatei sicher im target-Ordner zu lokalisieren
          # Dies verhindert Fehler bei unterschiedlichen Pfad-Strukturen
          cp $(find target/${{ matrix.target }}/release/ -maxdepth 1 -executable -type f -name "ipmc${BIN_EXT}") dist/ipmc-${{ matrix.target }}${BIN_EXT}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipmc-${{ matrix.target }}
          path: dist/

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish to GitHub
        uses: softprops/action-gh-release@v1
        with:
          files: release-assets/*
          generate_release_notes: true
